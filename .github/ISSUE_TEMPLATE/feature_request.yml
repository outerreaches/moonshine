name: Feature request
description: Propose a scoped Moonshine improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include memory, I/O, correctness, and compatibility implications
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
